[package]
name = "apollo-office"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "An office of small Claude workers that turns GitHub issues into verified pull requests"
repository = "https://github.com/Silvertree2010/ApolloOffice"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
anyhow = "1"
mime_guess = "2"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
