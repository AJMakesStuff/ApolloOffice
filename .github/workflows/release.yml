name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: apollo-office-windows-x64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: apollo-office-windows-arm64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: apollo-office-linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: apollo-office-linux-arm64, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: apollo-office-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: apollo-office-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          f=target/${{ matrix.target }}/release/apollo-office
          [ -f "$f.exe" ] && f="$f.exe"
          cp "$f" "${{ matrix.name }}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.name }}
          prerelease: ${{ contains(github.ref_name, '-') }}

